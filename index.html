<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CertifiedSky</title>
    <style>
        /* Global Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            overflow-x: hidden;
        }

        /* Enhanced Background Animation */
        .space-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(ellipse at bottom, #1B2735 0%, #090A0F 100%);
            overflow: hidden;
        }

        /* Stars Animation */
        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .star {
            position: absolute;
            border-radius: 50%;
            background-color: #ffffff;
            animation: twinkle var(--duration) infinite ease-in-out;
            opacity: var(--opacity);
        }

        @keyframes twinkle {
            0%, 100% { opacity: var(--opacity); transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* Nebula Effect */
        .nebula {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 30% 20%, rgba(128, 0, 128, 0.15) 0%, rgba(128, 0, 128, 0) 25%),
                radial-gradient(circle at 70% 60%, rgba(0, 128, 255, 0.15) 0%, rgba(0, 128, 255, 0) 25%),
                radial-gradient(circle at 50% 90%, rgba(255, 204, 0, 0.15) 0%, rgba(255, 204, 0, 0) 25%);
            filter: blur(8px);
            animation: nebulaFloat 120s infinite alternate ease-in-out;
        }

        @keyframes nebulaFloat {
            0% { transform: scale(1) rotate(0deg); }
            100% { transform: scale(1.2) rotate(5deg); }
        }

        /* Shooting Stars */
        .shooting-star {
            position: absolute;
            width: var(--length);
            height: 2px;
            background: linear-gradient(90deg, rgba(255,255,255,0), #ffcc00 20%, #ffffff);
            border-radius: 50%;
            animation: shooting-star var(--duration) linear infinite;
            opacity: 0;
            transform-origin: right;
            z-index: 1;
        }

        @keyframes shooting-star {
            0% { 
                transform: translateX(0) translateY(0) rotate(var(--angle));
                opacity: 0;
            }
            5% { opacity: 1; }
            20% { opacity: 1; }
            30% { 
                transform: translateX(calc(var(--travel-x) * -1)) translateY(var(--travel-y)) rotate(var(--angle));
                opacity: 0;
            }
            100% { 
                transform: translateX(calc(var(--travel-x) * -1)) translateY(var(--travel-y)) rotate(var(--angle));
                opacity: 0;
            }
        }

        /* Glowing Orbs */
        .orb {
            position: absolute;
            border-radius: 50%;
            box-shadow: 0 0 60px 30px var(--color);
            background-color: rgba(255, 255, 255, 0.1);
            animation: orbFloat var(--duration) infinite alternate ease-in-out;
            opacity: 0.4;
            filter: blur(8px);
        }

        @keyframes orbFloat {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(var(--move-x), var(--move-y)) scale(1.2); }
        }

        /* Magic Circle Animation */
        .magic-circle {
            position: absolute;
            border-radius: 50%;
            border: 1px solid rgba(255, 204, 0, 0.3);
            opacity: 0.5;
            animation: rotate var(--duration) linear infinite;
        }

        .magic-circle:before, .magic-circle:after {
            content: '';
            position: absolute;
            border-radius: 50%;
            border: 1px solid rgba(255, 204, 0, 0.2);
            width: calc(100% - 20px);
            height: calc(100% - 20px);
            top: 10px;
            left: 10px;
        }

        .magic-circle:after {
            width: calc(100% - 40px);
            height: calc(100% - 40px);
            top: 20px;
            left: 20px;
            border-color: rgba(255, 255, 255, 0.2);
        }

        .magic-circle .rune {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: rgba(255, 204, 0, 0.5);
            border-radius: 50%;
        }

        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Parallax Effect */
        .parallax-layer {
            position: absolute;
            width: 100%;
            height: 100%;
            transition: transform 0.1s ease-out;
        }

        /* Rest of your existing CSS */
        /* Navigation */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 5%;
            background-color: rgba(18, 18, 18, 0.8);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 2px solid #ffcc00;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            color: #ffcc00;
            text-shadow: 0 0 10px rgba(255, 204, 0, 0.5);
            transition: all 0.3s ease;
        }

        .logo:hover {
            text-shadow: 0 0 20px rgba(255, 204, 0, 0.8);
        }

        .nav-links {
            display: flex;
            gap: 2rem;
        }

        .nav-link {
            color: #ffffff;
            text-decoration: none;
            font-weight: 500;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            position: relative;
        }

        .nav-link:after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: -5px;
            left: 0;
            background-color: #ffcc00;
            transition: width 0.3s ease;
        }

        .nav-link:hover {
            color: #ffcc00;
        }

        .nav-link:hover:after {
            width: 100%;
        }

        /* Copy Message */
        .copy-message {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(255, 204, 0, 0.9);
            color: #121212;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 1000;
        }

        /* Hero Section */
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 1rem;
            position: relative;
            z-index: 2;
        }

        .hero h1 {
            font-size: 4rem;
            margin-bottom: 1rem;
            background: linear-gradient(90deg, #ffcc00, #ff9900);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: fadeInUp 1s ease;
            text-shadow: 0 0 20px rgba(255, 204, 0, 0.3);
        }

        .hero p {
            font-size: 1.5rem;
            margin-bottom: 2rem;
            max-width: 800px;
            animation: fadeInUp 1s ease 0.2s;
            animation-fill-mode: both;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* IP Box */
        .ip-box {
            background-color: rgba(30, 30, 30, 0.8);
            border: 2px solid #ffcc00;
            border-radius: 8px;
            padding: 1rem 2rem;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(255, 204, 0, 0.3);
            animation: fadeInUp 1s ease 0.4s;
            animation-fill-mode: both;
            position: relative;
            overflow: hidden;
        }

        .ip-box:before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                to bottom right,
                rgba(255, 204, 0, 0) 0%,
                rgba(255, 204, 0, 0) 40%,
                rgba(255, 204, 0, 0.3) 50%,
                rgba(255, 204, 0, 0) 60%,
                rgba(255, 204, 0, 0) 100%
            );
            transform: rotate(45deg);
            animation: shine 3s infinite;
            z-index: 1;
        }

        @keyframes shine {
            0% { left: -150%; }
            100% { left: 150%; }
        }

        .ip-box:hover {
            background-color: rgba(40, 40, 40, 0.8);
            box-shadow: 0 0 25px rgba(255, 204, 0, 0.5);
            transform: translateY(-5px);
        }

        .ip-box p {
            font-size: 1.5rem;
            font-weight: 700;
            margin: 0;
            color: #ffcc00;
            position: relative;
            z-index: 2;
        }

        /* Stats Section */
        .stats {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 2rem;
            margin-bottom: 4rem;
            animation: fadeInUp 1s ease 0.6s;
            animation-fill-mode: both;
            position: relative;
            z-index: 2;
        }

        .stat-card {
            background-color: rgba(30, 30, 30, 0.8);
            border-radius: 8px;
            padding: 1.5rem;
            width: 180px;
            text-align: center;
            transition: all 0.3s ease;
            border: 1px solid #2a2a2a;
            position: relative;
            overflow: hidden;
        }

        .stat-card:hover {
            transform: translateY(-10px);
            background-color: rgba(40, 40, 40, 0.8);
            border-color: #ffcc00;
        }

        .stat-card:after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(
                circle,
                rgba(255, 204, 0, 0.1) 0%,
                rgba(255, 204, 0, 0) 70%
            );
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .stat-card:hover:after {
            opacity: 1;
        }

        .stat-icon {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: #ffcc00;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: #ffffff;
        }

        .stat-label {
            font-size: 1rem;
            color: #aaaaaa;
        }

        /* Responsive Styles */
        @media (max-width: 768px) {
            .hero h1 {
                font-size: 3rem;
            }

            .hero p {
                font-size: 1.2rem;
            }

            .nav-links {
                display: none;
            }
        }
    </style>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Enhanced Space Background Animation -->
    <div class="space-background" id="space-background">
        <div class="parallax-layer" data-depth="0.1">
            <div class="nebula"></div>
        </div>
        <div class="parallax-layer" data-depth="0.2" id="stars-container">
            <!-- Stars will be added via JavaScript -->
        </div>
        <div class="parallax-layer" data-depth="0.3" id="shooting-stars-container">
            <!-- Shooting stars will be added via JavaScript -->
        </div>
        <div class="parallax-layer" data-depth="0.4" id="orbs-container">
            <!-- Glowing orbs will be added via JavaScript -->
        </div>
        <div class="parallax-layer" data-depth="0.5" id="magic-circles-container">
            <!-- Magic circles will be added via JavaScript -->
        </div>
    </div>

    <!-- Copy Message -->
    <div class="copy-message" id="copy-message">Server IP copied to clipboard!</div>

    <!-- Navigation -->
    <nav>
        <a href="#" class="logo">CertifiedSky</a>
        <div class="nav-links">
            <a href="#" class="nav-link">Home</a>
            <a href="#shop" class="nav-link">Shop</a>
            <a href="#features" class="nav-link">Features</a>
            <a href="https://discord.gg/T8VWymreVS" class="nav-link">Discord</a>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero">
        <h1>Welcome to CertifiedSky</h1>
        <p>Experience premium Minecraft gameplay on our state-of-the-art generation server</p>
        
        <!-- IP Box -->
        <div class="ip-box" id="ip-box">
            <p>certifiedsky.minehut.gg</p>
        </div>

        <!-- Stats -->
        <div class="stats">
            <div class="stat-card">
                <div class="stat-icon">
                    <i class="fas fa-users"></i>
                </div>
                <div class="stat-value">5,000+</div>
                <div class="stat-label">Visits</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">
                    <i class="fas fa-clock"></i>
                </div>
                <div class="stat-value">99.9%</div>
                <div class="stat-label">Uptime</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">
                    <i class="fas fa-headset"></i>
                </div>
                <div class="stat-value">24/7</div>
                <div class="stat-label">Support</div>
            </div>
        </div>
    </section>

    <!-- Scripts -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Get containers
            const starsContainer = document.getElementById('stars-container');
            const shootingStarsContainer = document.getElementById('shooting-stars-container');
            const orbsContainer = document.getElementById('orbs-container');
            const magicCirclesContainer = document.getElementById('magic-circles-container');
            const spaceBackground = document.getElementById('space-background');
            const parallaxLayers = document.querySelectorAll('.parallax-layer');
            
            // Create stars
            for (let i = 0; i < 250; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                
                // Random size between 1px and 3px
                const size = Math.random() * 2 + 1;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                
                // Random position
                star.style.left = `${Math.random() * 100}%`;
                star.style.top = `${Math.random() * 100}%`;
                
                // Random animation duration between 2s and 6s
                const duration = Math.random() * 4 + 2;
                star.style.setProperty('--duration', `${duration}s`);
                
                // Random initial opacity between 0.2 and 0.7
                const opacity = Math.random() * 0.5 + 0.2;
                star.style.setProperty('--opacity', opacity);
                
                // Random animation delay
                star.style.animationDelay = `${Math.random() * 5}s`;
                
                starsContainer.appendChild(star);
            }
            
            // Create shooting stars
            function createShootingStar() {
                const shootingStar = document.createElement('div');
                shootingStar.className = 'shooting-star';
                
                // Random position at the edges of the screen
                const side = Math.floor(Math.random() * 4); // 0: top, 1: right, 2: bottom, 3: left
                let posX, posY;
                
                switch(side) {
                    case 0: // top
                        posX = Math.random() * 100;
                        posY = 0;
                        break;
                    case 1: // right
                        posX = 100;
                        posY = Math.random() * 100;
                        break;
                    case 2: // bottom
                        posX = Math.random() * 100;
                        posY = 100;
                        break;
                    case 3: // left
                        posX = 0;
                        posY = Math.random() * 100;
                        break;
                }
                
                shootingStar.style.left = `${posX}%`;
                shootingStar.style.top = `${posY}%`;
                
                // Random angle
                const angle = Math.random() * 60 - 30;
                shootingStar.style.setProperty('--angle', `${angle}deg`);
                
                // Random length between 50px and 150px
                const length = Math.random() * 100 + 50;
                shootingStar.style.setProperty('--length', `${length}px`);
                
                // Random travel distance
                const travelX = Math.random() * 500 + 300;
                const travelY = Math.random() * 500 + 300;
                shootingStar.style.setProperty('--travel-x', `${travelX}px`);
                shootingStar.style.setProperty('--travel-y', `${travelY}px`);
                
                // Random duration between 2s and 4s
                const duration = Math.random() * 2 + 2;
                shootingStar.style.setProperty('--duration', `${duration}s`);
                
                // Add to container
                shootingStarsContainer.appendChild(shootingStar);
                
                // Remove after animation completes
                setTimeout(() => {
                    shootingStar.remove();
                }, duration * 1000);
            }
            
            // Periodically create shooting stars
            setInterval(createShootingStar, 1000);
            
            // Create initial batch of shooting stars
            for (let i = 0; i < 5; i++) {
                setTimeout(createShootingStar, Math.random() * 2000);
            }
            
            // Create glowing orbs
            const orbColors = ['rgba(255, 204, 0, 0.3)', 'rgba(100, 200, 255, 0.3)', 'rgba(255, 100, 255, 0.3)'];
            
            for (let i = 0; i < 5; i++) {
                const orb = document.createElement('div');
                orb.className = 'orb';
                
                // Random size between 100px and 300px
                const size = Math.random() * 200 + 100;
                orb.style.width = `${size}px`;
                orb.style.height = `${size}px`;
                
                // Random position
                orb.style.left = `${Math.random() * 100}%`;
                orb.style.top = `${Math.random() * 100}%`;
                
                // Random color
                const color = orbColors[Math.floor(Math.random() * orbColors.length)];
                orb.style.setProperty('--color', color);
                
                // Random movement range
                const moveX = (Math.random() * 100 - 50) + 'px';
                const moveY = (Math.random() * 100 - 50) + 'px';
                orb.style.setProperty('--move-x', moveX);
                orb.style.setProperty('--move-y', moveY);
                
                // Random animation duration between 15s and 30s
                const duration = Math.random() * 15 + 15;
                orb.style.setProperty('--duration', `${duration}s`);
                
                // Random animation delay
                orb.style.animationDelay = `${Math.random() * 5}s`;
                
                orbsContainer.appendChild(orb);
            }
            
            // Create magic circles
            for (let i = 0; i < 3; i++) {
                const magicCircle = document.createElement('div');
                magicCircle.className = 'magic-circle';
                
                // Random size between 300px and 500px
                const size = Math.random() * 200 + 300;
                magicCircle.style.width = `${size}px`;
                magicCircle.style.height = `${size}px`;
                
                // Random position (centered more in the middle)
                magicCircle.style.left = `${Math.random() * 50 + 25}%`;
                magicCircle.style.top = `${Math.random() * 50 + 25}%`;
                
                // Random animation duration between 30s and 60s
                const duration = Math.random() * 30 + 30;
                magicCircle.style.setProperty('--duration', `${duration}s`);
                
                // Add runes to magic circle
                const runeCount = Math.floor(Math.random() * 5) + 5;
                for (let j = 0; j < runeCount; j++) {
                    const rune = document.createElement('div');
                    rune.className = 'rune';
                    
                    // Position along the circle
                    const angle = (j / runeCount) * 360;
                    const radius = size / 2;
                    const runeX = Math.cos(angle * Math.PI / 180) * radius + radius - 5;
                    const runeY = Math.sin(angle * Math.PI / 180) * radius + radius - 5;
                    
                    rune.style.left = `${runeX}px`;
                    rune.style.top = `${runeY}px`;
                    
                    magicCircle.appendChild(rune);
                }
                
                magicCirclesContainer.appendChild(magicCircle);
            }
            
            // Parallax effect
            document.addEventListener('mousemove', function(e) {
                const mouseX = e.clientX / window.innerWidth;
                const mouseY = e.clientY / window.innerHeight;
                
                parallaxLayers.forEach(layer => {
                    const depth = layer.getAttribute('data-depth');
                    const moveX = (mouseX - 0.5) * depth * 50;
                    const moveY = (mouseY - 0.5) * depth * 50;
                    layer.style.transform = `translate3d(${moveX}px, ${moveY}px, 0)`;
                });
            });
            
            // IP Copy functionality
            const ipBox = document.getElementById('ip-box');
            const copyMessage = document.getElementById('copy-message');
            
            ipBox.addEventListener('click', function() {
                const ipText = this.querySelector('p').innerText;
                navigator.clipboard.writeText(ipText).then(function() {
                    copyMessage.style.opacity = '1';
                    setTimeout(function() {
                        copyMessage.style.opacity = '0';
                    }, 2000);
                });
            });
        });
    </script>
</body>
</html>
